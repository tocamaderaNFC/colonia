<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de CBU Cliente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Scrollbar styling para un look más limpio */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-gray-100 h-screen w-screen overflow-hidden flex flex-col md:flex-row">

    <!-- Panel de Administrador (Izquierda) -->
    <aside class="w-full md:w-80 lg:w-96 bg-white shadow-2xl flex flex-col h-full z-10 border-r border-gray-200">
        <div class="p-6 border-b border-gray-100">
            <h1 class="text-2xl font-bold text-gray-800 flex items-center gap-2">
                <svg class="w-6 h-6 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                Admin CBU
            </h1>
            <p class="text-sm text-gray-500 mt-1">Configura el modelo para el cliente.</p>
        </div>

        <div class="flex-1 overflow-y-auto p-6 space-y-6">
            
            <!-- Input: Nombre y Apellido -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Nombre y Apellido del Titular</label>
                <input type="text" id="inputName" value="JUAN PÉREZ" placeholder="Ej: JUAN PÉREZ" 
                    class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-red-500 focus:border-red-500 transition-colors uppercase text-sm">
            </div>

            <!-- Input: CBU / N° de cuenta -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">CBU / N° de cuenta</label>
                <input type="text" id="inputCBU" value="0000000000000000000000" placeholder="0000000000000000000000" maxlength="22"
                    class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-red-500 focus:border-red-500 transition-colors font-mono text-sm tracking-widest">
            </div>

            <!-- Input: Logo -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Logo de la Entidad</label>
                <div class="mt-1 flex justify-center px-6 pt-5 pb-6 border-2 border-gray-300 border-dashed rounded-lg hover:border-red-500 transition-colors group cursor-pointer" onclick="document.getElementById('inputLogo').click()">
                    <div class="space-y-1 text-center">
                        <svg class="mx-auto h-12 w-12 text-gray-400 group-hover:text-red-500 transition-colors" stroke="currentColor" fill="none" viewBox="0 0 48 48" aria-hidden="true">
                            <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                        <div class="flex text-sm text-gray-600 justify-center">
                            <label for="inputLogo" class="relative cursor-pointer bg-white rounded-md font-medium text-red-600 hover:text-red-500 focus-within:outline-none focus-within:ring-2 focus-within:ring-offset-2 focus-within:ring-red-500">
                                <span>Subir un archivo</span>
                                <input id="inputLogo" name="inputLogo" type="file" accept="image/*" class="sr-only">
                            </label>
                        </div>
                        <p class="text-xs text-gray-500">PNG, JPG, SVG hasta 2MB</p>
                    </div>
                </div>
                <button id="btnResetLogo" class="mt-2 text-xs text-gray-500 hover:text-red-600 underline w-full text-right hidden">Restaurar Logo Scotiabank</button>
            </div>

        </div>

        <!-- Botón Exportar -->
        <div class="p-6 bg-gray-50 border-t border-gray-200">
            <button id="btnExport" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg transform hover:-translate-y-0.5 transition-all flex items-center justify-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                Exportar Modelo Cliente
            </button>
        </div>
    </aside>

    <!-- Panel de Vista Previa (Derecha) -->
    <main class="flex-1 bg-gray-200 flex items-center justify-center p-4 relative overflow-hidden">
        <!-- Decoración de fondo -->
        <div class="absolute inset-0 opacity-10 pointer-events-none" style="background-image: radial-gradient(#000 1px, transparent 1px); background-size: 20px 20px;"></div>
        
        <!-- Contenedor estilo "Teléfono" para la vista previa -->
        <div class="relative shadow-2xl rounded-[3rem] border-[10px] border-gray-900 bg-white w-full max-w-[400px] h-[800px] max-h-full overflow-hidden flex flex-col z-10 transition-transform hover:scale-[1.02] duration-300">
            <!-- Muesca (Notch) simulada -->
            <div class="absolute top-0 inset-x-0 h-6 bg-gray-900 rounded-b-3xl w-40 mx-auto z-20"></div>
            
            <!-- El iframe donde se inyectará el código generado -->
            <iframe id="previewFrame" class="w-full h-full border-0" allow="clipboard-write"></iframe>
        </div>
    </main>

    <script>
        // Variables de estado
        const defaultLogoSVG = `data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0MDAgMTAwIj48dGV4dCB4PSI1MCUiIHk9IjUwJSIgZG9taW5hbnQtYmFzZWxpbmU9Im1pZGRsZSIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZm9udC1mYW1pbHk9IkhlbHZldGljYSwgQXJpYWwsIHNhbnMtc2VyaWYiIGZvbnQtd2VpZ2h0PSI5MDAiIGZvbnQtc2l6ZT0iNjQiIGZpbGw9IiNFQzExMUEiPlNjb3RpYWJhbms8L3RleHQ+PC9zdmc+`;
        
        let state = {
            name: 'NOMBRE APELLIDO',
            cbu: '0000000000000000000000',
            logoBase64: defaultLogoSVG
        };

        // Elementos del DOM
        const inputName = document.getElementById('inputName');
        const inputCBU = document.getElementById('inputCBU');
        const inputLogo = document.getElementById('inputLogo');
        const previewFrame = document.getElementById('previewFrame');
        const btnExport = document.getElementById('btnExport');
        const btnResetLogo = document.getElementById('btnResetLogo');

        // Función principal generadora del HTML final
        function generateHTML(name, cbu, logoUrl) {
            return `<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Transferencia - ${name}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #f5f5f7;
            color: #1d1d1f;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px;
        }

        .card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 400px;
            padding: 32px 24px;
            text-align: center;
            margin-top: 20px;
        }

        .logo-container {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            min-height: 64px;
        }

        .logo-img {
            max-width: 80%;
            max-height: 80px;
            object-fit: contain;
        }

        h1 {
            font-size: 18px;
            font-weight: 600;
            color: #6e6e73;
            margin-bottom: 4px;
        }

        .titular {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 28px;
            color: #1d1d1f;
            text-transform: uppercase;
        }

        .label {
            font-size: 13px;
            color: #6e6e73;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .cbu-box {
            background: #f5f5f7;
            border-radius: 14px;
            padding: 18px 12px;
            margin-bottom: 20px;
            font-family: 'SF Mono', 'Roboto Mono', monospace;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 1px;
            word-break: break-all;
            line-height: 1.4;
            color: #1d1d1f;
            border: 2px solid transparent;
            transition: all 0.2s;
        }

        .cbu-box.copied {
            border-color: #34c759;
            background: #f0fdf4;
            color: #059669;
        }

        .btn-copiar {
            width: 100%;
            background: #EC111A;
            color: white;
            border: none;
            border-radius: 14px;
            padding: 18px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin-bottom: 28px;
            box-shadow: 0 4px 14px rgba(236, 17, 26, 0.3);
        }

        .btn-copiar:active {
            transform: scale(0.98);
            background: #c90e16;
        }

        .btn-copiar.success {
            background: #34c759;
            box-shadow: 0 4px 14px rgba(52, 199, 89, 0.3);
        }

        .pasos {
            text-align: left;
            background: #f9f9fb;
            border-radius: 14px;
            padding: 20px;
        }

        .pasos h3 {
            font-size: 15px;
            margin-bottom: 14px;
            color: #1d1d1f;
        }

        .paso {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
            font-size: 14px;
            line-height: 1.4;
            color: #3a3a3c;
        }

        .paso:last-child {
            margin-bottom: 0;
        }

        .numero {
            background: #EC111A;
            color: white;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            flex-shrink: 0;
        }

        .nota {
            margin-top: 24px;
            font-size: 12px;
            color: #8e8e93;
            line-height: 1.5;
        }

        /* Toast de confirmación */
        .toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #1d1d1f;
            color: white;
            padding: 14px 24px;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 500;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 100;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            text-align: center;
            white-space: nowrap;
        }

        .toast.error {
            background: #EC111A;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="logo-container">
            <img src="${logoUrl}" alt="Logo" class="logo-img" />
        </div>

        <h1>Transferencia a</h1>
        <div class="titular">${name || 'NOMBRE APELLIDO'}</div>

        <div class="label">CBU / N° de cuenta</div>
        <div class="cbu-box" id="cbu">${cbu || '0000000000000000000000'}</div>

        <button class="btn-copiar" id="btnCopiar" onclick="copiarCBU()">
            Copiar este número
        </button>

        <div class="pasos">
            <h3>Cómo transferir</h3>
            <div class="paso">
                <div class="numero">1</div>
                <div>Tocá el botón de arriba para copiar el CBU</div>
            </div>
            <div class="paso">
                <div class="numero">2</div>
                <div>Abrí la app de tu banco o billetera virtual</div>
            </div>
            <div class="paso">
                <div class="numero">3</div>
                <div>Pegá el número y completá la transferencia</div>
            </div>
        </div>

        <p class="nota">
            Verificá que el nombre del destinatario coincida con el que aparece arriba. 
            Si no coincide, el banco puede rechazar la operación.
        </p>
    </div>

    <div class="toast" id="toast">¡CBU copiado!</div>

    <script>
        // Datos inyectados desde el generador
        const CBU = "${cbu || '0000000000000000000000'}";   

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            if (isError) {
                toast.classList.add('error');
            } else {
                toast.classList.remove('error');
            }
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        function fallbackCopy(text) {
            var textArea = document.createElement("textarea");
            textArea.value = text;
            // Evitar scroll visual al agregar el textarea
            textArea.style.top = "0";
            textArea.style.left = "0";
            textArea.style.position = "fixed";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();

            try {
                var successful = document.execCommand('copy');
                if(successful){
                    handleSuccess();
                } else {
                    showToast("Error al copiar. Selecciona el número manualmente.", true);
                }
            } catch (err) {
                showToast("Error al copiar. Selecciona el número manualmente.", true);
            }
            document.body.removeChild(textArea);
        }

        function handleSuccess() {
            const btn = document.getElementById('btnCopiar');
            btn.textContent = "¡Copiado!";
            btn.classList.add('success');

            document.getElementById('cbu').classList.add('copied');
            showToast("¡CBU copiado con éxito!");

            setTimeout(() => {
                btn.textContent = "Copiar este número";
                btn.classList.remove('success');
                document.getElementById('cbu').classList.remove('copied');
            }, 2500);
        }

        function copiarCBU() {
            if (!navigator.clipboard) {
                fallbackCopy(CBU);
                return;
            }
            
            navigator.clipboard.writeText(CBU).then(() => {
                handleSuccess();
            }).catch(err => {
                // Si falla (ej. permisos de iframe), intentar fallback
                fallbackCopy(CBU);
            });
        }
    <\/script>
</body>
</html>`;
        }

        // Actualizar la vista previa
        function updatePreview() {
            const html = generateHTML(state.name, state.cbu, state.logoBase64);
            previewFrame.srcdoc = html;
        }

        // Listeners de los inputs
        inputName.addEventListener('input', (e) => {
            state.name = e.target.value.toUpperCase();
            updatePreview();
        });

        inputCBU.addEventListener('input', (e) => {
            // Filtrar solo números
            let val = e.target.value.replace(/\D/g, '');
            e.target.value = val;
            state.cbu = val;
            updatePreview();
        });

        // Manejo de carga de imagen a Base64
        inputLogo.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    state.logoBase64 = event.target.result;
                    btnResetLogo.classList.remove('hidden');
                    updatePreview();
                };
                reader.readAsDataURL(file);
            }
        });

        // Restaurar logo original
        btnResetLogo.addEventListener('click', () => {
            state.logoBase64 = defaultLogoSVG;
            inputLogo.value = ''; // Limpiar input file
            btnResetLogo.classList.add('hidden');
            updatePreview();
        });

        // Exportar HTML
        btnExport.addEventListener('click', () => {
            const htmlContent = generateHTML(state.name, state.cbu, state.logoBase64);
            const blob = new Blob([htmlContent], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = 'transferencia.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });

        // Inicializar vista
        state.name = inputName.value;
        state.cbu = inputCBU.value;
        updatePreview();

    </script>
</body>
</html>
